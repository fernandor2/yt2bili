# ======================================================
# yt2bili Configuration
# ======================================================

# YouTube channels to monitor
# Get channel IDs from: https://www.youtube.com/@ChannelHandle
# View page source → search for "channelId" or "UC"
channels:
  - name: "Example Channel"
    channel_id: "UCxxxxxxxxxxxxxxxxxxxxxxxxx"
    # Optional: force a specific Bilibili partition for all videos of this channel
    # If not specified, the category is dynamically detected from each YouTube video
    # tid: 17

# Bilibili upload settings
bilibili:
  # Default Category/Partition ID if YouTube category cannot be detected or matched
  # 17 = Gaming (单机游戏), 188 = Tech/Digital (数码), 201 = Science/Education (科学科普)
  # 21 = Daily Life (日常), 138 = Comedy (搞笑), 71 = Entertainment (娱乐综合)
  tid: 17

  # Dynamic YouTube-to-Bilibili Category Mappings
  # The system detects YouTube's category automatically. You can override or customize here:
  category_mapping:
    "Gaming": 17                  # 单机游戏
    "Science & Technology": 188   # 科技/数码
    "Education": 201              # 科学科普
    "Film & Animation": 27        # 综合动画
    "Entertainment": 71           # 娱乐综合
    "Comedy": 138                 # 搞笑
    "Music": 130                  # 音乐综合
    "Sports": 234                 # 运动综合
    "Autos & Vehicles": 176       # 汽车综合
    "Pets & Animals": 217         # 动物圈综合
    "Travel & Events": 21         # 日常生活
    "People & Blogs": 21          # 日常生活
    "Howto & Style": 161          # 手工
    "News & Politics": 204        # 热点资讯

  # Copyright: 1 = original (自制), 2 = reprint (转载)
  copyright: 2
  # Tags (comma-separated, max 12)
  tags: "搬运,翻译,中文字幕"
  # Cookie file path
  cookie_file: "/app/cookies.json"

# Translation settings (Ollama)
translation:
  # Ollama API URL: connects directly to the container 'ollama' in the 'ai-net' Docker network
  ollama_host: "http://ollama:11434"
  # Model for translation (qwen2.5 series excels at EN→CN)
  model: "qwen2.5:7b"
  # Lines per translation batch (20-40 recommended)
  batch_size: 30
  # Temperature for translation (lower = more consistent)
  temperature: 0.3

# Subtitle settings
subtitles:
  # Source language(s) for subtitles (regex patterns supported)
  source_langs:
    - "en.*"
    - "en"
  # Whether to burn subtitles into video (recommended for Bilibili)
  burn_in: true
  # FFmpeg encoding preset (ultrafast/superfast/veryfast/faster/fast/medium)
  # 'faster' is ideal for AMD Ryzen 5700G (8 cores / 16 threads)
  ffmpeg_preset: "faster"
  # CRF quality (18-23 recommended; lower = better quality, bigger file)
  ffmpeg_crf: 20
  # Font for burned subtitles
  font_name: "Noto Sans CJK SC"
  font_size: 18

# Pipeline settings
pipeline:
  # Directory for downloaded videos
  download_dir: "/app/data/downloads"
  # SQLite database for tracking processed videos
  db_path: "/app/data/db/processed.db"
  # Max concurrent downloads
  max_downloads: 2
  # Delete local files after successful upload
  cleanup_after_upload: true
  # Max video file size in GB (skip larger files)
  max_file_size_gb: 8
