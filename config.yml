# ======================================================
# yt2bili Configuration
# ======================================================

# YouTube channels to monitor
# Obtain channel IDs from: https://www.youtube.com/@ChannelHandle
# View channel page source → search for "channelId" or "UC"
channels:
  - name: "Example Channel"
    channel_id: "UCxxxxxxxxxxxxxxxxxxxxxxxxx"
    # Optional: explicitly override the Bilibili partition TID for this channel.
    # If omitted, the category is dynamically detected from each YouTube video.
    # tid: 17

# Bilibili upload settings
bilibili:
  # Default Category/Partition ID if YouTube category cannot be detected or mapped
  # 17 = Gaming (单机游戏), 188 = Tech/Digital (数码), 201 = Science/Education (科学科普)
  # 21 = Daily Life (日常), 138 = Comedy (搞笑), 71 = Entertainment (娱乐综合)
  tid: 71

  # Dynamic YouTube-to-Bilibili Category Mappings
  # The system detects YouTube's category automatically. You can customize or override here:
  category_mapping:
    "Gaming": 17                  # Single-player Games (单机游戏)
    "Science & Technology": 188   # Technology & Digital (数码)
    "Education": 201              # Science & Knowledge (科学科普)
    "Film & Animation": 182       # Film & TV Discussions & Theories (影视杂谈)
    "Film": 182                   # Film & TV Discussions & Theories (影视杂谈)
    "Animation": 27               # Animation Comprehensive (综合动画)
    "Entertainment": 71           # Entertainment Comprehensive (娱乐综合)
    "Comedy": 138                 # Comedy (搞笑)
    "Music": 130                  # Music Comprehensive (音乐综合)
    "Sports": 234                 # Sports Comprehensive (运动综合)
    "Autos & Vehicles": 176       # Automobiles & Vehicles (汽车综合)
    "Pets & Animals": 217         # Pets & Animals (动物圈)
    "Travel & Events": 21         # Daily Life & Travel (日常)
    "People & Blogs": 21          # Daily Life (日常)
    "Howto & Style": 161          # Crafts & Lifestyle (手工)
    "News & Politics": 204        # Hot Topics & News (热点)

  # Copyright:
  # 1 = Original (自制 - RECOMMENDED for creator-owned content: better algorithm traffic, protection & monetization)
  # 2 = Reprint (转载)
  copyright: 1

  # Tags (comma-separated, up to 12 tags)
  tags: "原创,翻译,中文字幕"

  # Path to persistent cookies file (stored inside persistent ./data/ directory)
  cookie_file: "/app/data/cookies.json"

# Standalone Whisper Speech-to-Text Fallback
# When a YouTube video lacks manual or auto-generated captions, this calls your
# standalone faster-whisper container on the 'ai-net' network (reusable by n8n as well).
whisper:
  enabled: true
  # Connects directly to the 'whisper' container via the shared 'ai-net' Docker network
  url: "http://whisper:8000/v1/audio/transcriptions"
  # Model identifier
  model: "deepdml/faster-whisper-large-v3-turbo-ct2"
  # Transcription request timeout in seconds (300s = 5 min)
  timeout: 300

# Translation settings (Ollama)
translation:
  # Ollama API URL: connects directly to the container 'ollama' in the 'ai-net' Docker network
  ollama_host: "http://ollama:11434"
  # Model for translation (qwen2.5 series is the top open-weights model for EN/ES -> CN)
  model: "qwen2.5:14b"
  # Lines per translation batch (10-15 optimal for 14B model on CPU)
  batch_size: 15
  # Temperature for translation (lower = more deterministic and consistent)
  temperature: 0.3

# Subtitle settings
subtitles:
  # Source language(s) for subtitles (supports regex patterns and exact codes).
  # Prioritizes native original audio transcripts (es-orig) to avoid Google auto-translation 429 rate limits.
  source_langs:
    - "es-orig"
    - "es"
    - "es-419"
    - "es.*"
    - "en-orig"
    - "en"
    - "en.*"

  # Whether to burn subtitles into video (recommended for Bilibili)
  burn_in: true

  # Subtitle styling mode:
  # 3 = Opaque black background box (遮挡框) - Cleanly covers pre-existing burned subtitles
  # 1 = Standard outline without background box
  border_style: 3

  # Padding around the Chinese text in the background box (in pixels)
  box_padding: 4

  # Vertical margin from the bottom edge (in pixels)
  margin_v: 30

  # Colors in ASS hexadecimal format (&HAABBGGRR):
  # Box color: &H00000000 = 100% solid opaque black
  box_color: "&H00000000"
  # Text color: &H00FFFFFF = Crisp pure white text
  text_color: "&H00FFFFFF"

  # Font settings
  font_name: "Noto Sans CJK SC"
  font_size: 20

  # FFmpeg encoding preset (ultrafast/superfast/veryfast/faster/fast/medium)
  # 'faster' offers an optimal balance of speed and compression on AMD Ryzen 5700G
  ffmpeg_preset: "faster"
  # CRF quality (18-23 recommended; lower = higher quality, larger file size)
  ffmpeg_crf: 20

# Pipeline settings
pipeline:
  # Cooldown in minutes between consecutive Bilibili uploads.
  # Prevents Bilibili anti-spam / risk control (风控: code 21070 'Submissions too frequent').
  # Default: 60 minutes.
  upload_cooldown_minutes: 60

  # Maximum number of videos to upload per pipeline run.
  # Keeping this at 1 smoothly distributes uploads across the schedule without burst flooding.
  max_uploads_per_run: 1

  # Interval in minutes between background checks when running in continuous daemon mode
  check_interval_minutes: 30

  # Number of days of channel history to scan and queue for processing (videos + Shorts)
  max_history_days: 90

  # Optional: Path to export Netscape format YouTube cookies file if YouTube enforces IP challenges.
  # Simply place a 'yt_cookies.txt' inside the ./data directory and it will be auto-detected.
  youtube_cookies_file: "/app/data/yt_cookies.txt"

  # Directory for temporary video downloads
  download_dir: "/app/data/downloads"
  # SQLite database for tracking processed videos and upload timestamps
  db_path: "/app/data/db/processed.db"
  # Maximum concurrent downloads
  max_downloads: 2
  # Delete local media files after successful upload
  cleanup_after_upload: true
  # Maximum video file size in GB (skip larger files to protect disk)
  max_file_size_gb: 8
