services:
  yt2bili:
    build: .
    container_name: yt2bili
    restart: unless-stopped
    volumes:
      # Persistent data: database, cookies.json, yt_cookies.txt, downloaded videos
      - ./data:/app/data
      # Config file
      - ./config.yml:/app/config.yml:ro
      # Live code mounts: changes take effect immediately on 'git pull' without rebuilding
      - ./src:/app/src:ro
      - ./entrypoint.sh:/app/entrypoint.sh:ro
    environment:
      - TZ=Europe/Madrid
      # Connects directly to the Ollama container via the shared Docker network 'ai-net'
      - OLLAMA_HOST=http://ollama:11434
      # Connects directly to the standalone Whisper container via 'ai-net'
      - WHISPER_URL=http://whisper:8000/v1/audio/transcriptions
    networks:
      - ai-net

networks:
  ai-net:
    external: true
