version: "3.8"

services:
  yt2bili:
    build: .
    container_name: yt2bili
    restart: unless-stopped
    volumes:
      # Persistent data: database, cookies, downloaded videos
      - ./data:/app/data
      # Config file
      - ./config.yml:/app/config.yml:ro
      # Bilibili cookies (generated once via biliup login)
      - ./cookies.json:/app/cookies.json
    environment:
      - TZ=Europe/Madrid
      # Ollama runs on the host; use host.docker.internal on Docker Desktop
      # or the host's LAN IP on Linux Docker
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # The pipeline runs on cron inside the container
    # Server operates 7am-2am, so we schedule within that window
